# Netlify detects Next.js and applies its adapter automatically.
[build]
  command = "npm run build"
  # Skip the build (and its deploy credits) when a push only touches files that don't affect the site:
  # CI config, docs and the design prototype. Exit 0 = skip. On the first build CACHED_COMMIT_REF is
  # missing, git diff fails, and Netlify builds as usual.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)README.md' ':(exclude)AGENTS.md' ':(exclude)CLAUDE.md' ':(exclude)design' ':(exclude).env.example'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
